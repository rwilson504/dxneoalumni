name: Deploy site

on:
  push:
    branches: [main]
  # A push made with GITHUB_TOKEN deliberately does not trigger other workflows, so the
  # ingest job's commit would otherwise never be published.
  workflow_run:
    workflows: ['Ingest photo uploads']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # npm 11 (Node 24+) records optional native dependency trees differently from
          # npm 10; mixing them makes `npm ci` reject a lockfile generated by the other.
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # Accepts either storage: the URL is not sensitive so the README suggests a
          # variable, but it works equally as a secret and the build fails outright
          # without it now that the public pages come from the database.
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL || secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
