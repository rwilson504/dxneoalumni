name: Relock

# Regenerates package-lock.json on Linux and commits it.
#
# npm only resolves the optional dependency branches that apply to the machine it runs
# on. Developing on Windows therefore produces a lockfile missing packages that Linux
# needs — `@napi-rs/wasm-runtime` requires `@emnapi/core`, which never gets resolved on
# Windows — and `npm ci` in CI then rejects it as out of sync. Neither `--os=linux` nor
# deleting the lockfile fixes that from a Windows machine.
#
# Run this from the Actions tab after any dependency change made on Windows.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm install --package-lock-only

      - name: Prove the lockfile installs cleanly
        run: npm ci

      - name: Commit
        run: |
          if git diff --quiet package-lock.json; then
            echo "Lockfile already correct for Linux."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate lockfile on linux"
          git push
