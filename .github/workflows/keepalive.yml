name: Supabase keepalive

# Free Supabase projects pause after 7 days without activity, which would silently
# break member sign-in. This reads a trivial view often enough to keep it awake.
#
# It also commits a timestamp every run. GitHub disables scheduled workflows after 60 days
# without repository activity, and a chapter can easily go a whole off-season without a
# push. That would stop this job, let the database pause, and freeze the public site at a
# stale event count with no warning.
on:
  schedule:
    - cron: '0 7 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Query heartbeat view
        env:
          SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Supabase is not configured yet, so there is nothing to keep alive."
            exit 0
          fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/heartbeat?select=checked_at" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "heartbeat responded $status"
          test "$status" = "200"

      # Runs even when the ping fails: a paused database is precisely when the 60-day
      # inactivity clock must not be allowed to run out.
      - name: Record the run
        if: always()
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/last-keepalive
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-keepalive
          git commit -m "chore: keepalive"
          git push
